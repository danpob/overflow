<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overflow — Thailand Flood Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map"></div>

<header id="bar">
  <div class="brand"><span class="logo">◢</span> Overflow <small data-i18n="brand_sub">Thailand flood tracker</small></div>
  <div id="days" role="group"></div>
  <button id="watchbtn" class="badge btn"></button>
  <div id="fresh" class="badge">…</div>
  <div id="lang" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="true">EN</button><button data-lang="th" aria-pressed="false">ไทย</button>
  </div>
</header>

<aside id="panel" aria-label="Map key and layers">
  <button id="collapse" aria-expanded="true" data-i18n-title="key_title"></button>
  <div id="panel-body">
    <p class="intro" data-i18n-html="intro"></p>

    <section>
      <label class="lyr"><input type="checkbox" data-layer="basins" checked>
        <span class="lyr-t" data-i18n="lay_basins"></span><span class="lyr-s" data-i18n="lay_basins_s"></span></label>
      <p class="cap" data-i18n-html="cap_basins"></p>
      <div class="row"><i class="area" style="background:#bfe3b4"></i><span data-i18n="lvl0"></span></div>
      <div class="row"><i class="area" style="background:#f7ec9a"></i><span data-i18n="lvl1"></span></div>
      <div class="row"><i class="area" style="background:#fbbf66"></i><span data-i18n="lvl2"></span></div>
      <div class="row"><i class="area" style="background:#ee6a4a"></i><span data-i18n="lvl3"></span></div>
      <div class="row"><i class="area" style="background:#a8222c"></i><span data-i18n="lvl4"></span></div>
    </section>

    <section>
      <label class="lyr"><input type="checkbox" data-layer="stations" checked>
        <span class="lyr-t" data-i18n="lay_stations"></span><span class="lyr-s" data-i18n="lay_stations_s"></span></label>
      <p class="cap" data-i18n="cap_stations"></p>
      <div class="row"><i class="dot" style="background:#2fa84f"></i><span data-i18n="st0"></span></div>
      <div class="row"><i class="dot" style="background:#e6d630"></i><span data-i18n="st1"></span></div>
      <div class="row"><i class="dot" style="background:#f28c28"></i><span data-i18n="st2"></span></div>
      <div class="row"><i class="dot" style="background:#e0302b"></i><span data-i18n="st3"></span></div>
      <div class="row"><i class="dot big" style="background:#7d0b14"></i><span data-i18n="st4"></span></div>
    </section>

    <section>
      <label class="lyr"><input type="checkbox" data-layer="crossings" checked>
        <span class="lyr-t" data-i18n="lay_cross"></span><span class="lyr-s" data-i18n="lay_cross_s"></span></label>
      <p class="cap" data-i18n="cap_cross"></p>
      <div class="row"><i class="dia solid"></i><span data-i18n="x_solid"></span></div>
      <div class="row"><i class="dia hollow"></i><span data-i18n="x_hollow"></span></div>
    </section>

    <section>
      <label class="lyr"><input type="checkbox" data-layer="khlongs" checked>
        <span class="lyr-t" data-i18n="lay_khl"></span><span class="lyr-s" data-i18n="lay_khl_s"></span></label>
      <p class="cap" data-i18n="cap_khl"></p>
      <div class="row"><i class="sw" style="background:#e0302b;height:5px"></i><span data-i18n="khl_a"></span></div>
      <div class="row"><i class="sw" style="background:#7d0b14;height:5px"></i><span data-i18n="khl_b"></span></div>
    </section>

    <section>
      <label class="lyr"><input type="checkbox" data-layer="flow" checked>
        <span class="lyr-t" data-i18n="lay_flow"></span><span class="lyr-s" data-i18n="lay_flow_s"></span></label>
      <p class="cap" data-i18n="cap_flow"></p>
      <div class="row"><i class="sw" style="background:#0a6ee6"></i><span data-i18n="trn_falling"></span></div>
      <div class="row"><i class="sw" style="background:#8a94a0"></i><span data-i18n="trn_stable"></span></div>
      <div class="row"><i class="sw" style="background:#f0a202"></i><span data-i18n="trn_rising"></span></div>
      <div class="row"><i class="sw" style="background:#d7301f"></i><span data-i18n="trn_rising_fast"></span></div>
      <div class="row muted"><i class="sw thin" style="background:#9aa3ab"></i><span data-i18n="trn_none"></span></div>
    </section>

    <label class="lyr minor"><input type="checkbox" data-layer="provinces"> <span data-i18n="lay_prov"></span></label>
  </div>
</aside>

<aside id="detail" hidden>
  <button id="close" data-i18n-aria="close">×</button>
  <div id="detail-body"></div>
</aside>

<footer id="foot" data-i18n-html="foot"></footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
